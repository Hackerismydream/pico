schema: pico.picobench.campaign.v1
suite: codecairn-memory-effect

provider:
  name: deepseek
  model: deepseek-v4-flash
  allow_fallback: false

execution:
  timeout_seconds: 180
  retry_policy: symmetric
  provider_call_max_attempts: 2
  max_comparison_block_attempts: 2
  max_retrieval_query_block_attempts: 1

budget:
  warning_cny: 80
  hard_cap_cny: 99.9
  max_provider_calls_per_trial: 7
  max_input_tokens_per_call: 16000
  max_output_tokens_per_call: 2048
  max_additional_provider_attempts: 36
  input_cache_miss_usd_per_million: 0.14
  output_usd_per_million: 0.28
  conservative_usd_to_cny_multiplier: 8
  external_service_reserve_cny: 10
  pricing_source: https://api-docs.deepseek.com/quick_start/pricing/
  provider_trial_budgets:
    codecairn-memory-effect-calibration-v1:
      max_provider_calls_per_trial: 7
      max_input_tokens_per_call: 16000
      max_output_tokens_per_call: 2048
    codecairn-memory-effect-v1:
      max_provider_calls_per_trial: 7
      max_input_tokens_per_call: 16000
      max_output_tokens_per_call: 2048

calibration:
  suite: codecairn-memory-effect-calibration
  repetitions: 1
  pack_ids:
    - codecairn-memory-effect-calibration-v1
  expected_trials: 4
  expected_retrieval_cases: 0
  max_comparison_block_retries_total: 1
  expected_trials_by_pack:
    codecairn-memory-effect-calibration-v1: 4
  expected_comparison_blocks_by_pack:
    codecairn-memory-effect-calibration-v1: 2
  expected_retrieval_cases_by_pack:
    codecairn-memory-effect-calibration-v1: 0

formal:
  suite: codecairn-memory-effect-formal
  repetitions: 2
  pack_ids:
    - codecairn-memory-effect-v1
  expected_trials: 32
  expected_retrieval_cases: 0
  max_comparison_block_retries_total: 2
  expected_trials_by_pack:
    codecairn-memory-effect-v1: 32
  expected_comparison_blocks_by_pack:
    codecairn-memory-effect-v1: 16
  expected_retrieval_cases_by_pack:
    codecairn-memory-effect-v1: 0

claim_rules:
  - rule_id: codecairn-memory-off-zero-operations
    metric: codecairn_memory.memory_off_operation_calls
    operator: eq
    threshold: 0
    prerequisites:
      - codecairn_memory.ship_complete
      - codecairn_memory.measurement_valid
      - codecairn_memory.production_evidence_complete
  - rule_id: codecairn-memory-no-two-of-two-regression
    metric: codecairn_memory.tasks_with_two_of_two_regressions
    operator: eq
    threshold: 0
    prerequisites:
      - codecairn_memory.ship_complete
      - codecairn_memory.measurement_valid
      - codecairn_memory.production_evidence_complete
  - rule_id: codecairn-memory-task-effect
    metric: codecairn_memory.net_verifier_gains
    operator: ge
    threshold: 4
    prerequisites:
      - codecairn_memory.ship_complete
      - codecairn_memory.measurement_valid
      - codecairn_memory.production_evidence_complete
  - rule_id: codecairn-memory-task-coverage
    metric: codecairn_memory.positive_tasks
    operator: ge
    threshold: 3
    prerequisites:
      - codecairn_memory.ship_complete
      - codecairn_memory.measurement_valid
      - codecairn_memory.production_evidence_complete
  - rule_id: codecairn-memory-recall-at-five
    metric: codecairn_memory.recall_at_5
    operator: ge
    threshold: 0.8
    prerequisites:
      - codecairn_memory.ship_complete
      - codecairn_memory.measurement_valid
      - codecairn_memory.production_evidence_complete
  - rule_id: codecairn-memory-irrelevant-injection
    metric: codecairn_memory.irrelevant_injection_rate
    operator: le
    threshold: 0.05
    prerequisites:
      - codecairn_memory.ship_complete
      - codecairn_memory.measurement_valid
      - codecairn_memory.production_evidence_complete
  - rule_id: codecairn-memory-stale-injection
    metric: codecairn_memory.stale_injection_count
    operator: eq
    threshold: 0
    prerequisites:
      - codecairn_memory.ship_complete
      - codecairn_memory.measurement_valid
      - codecairn_memory.production_evidence_complete
  - rule_id: codecairn-memory-cross-repository-leakage
    metric: codecairn_memory.cross_repository_leakage_count
    operator: eq
    threshold: 0
    prerequisites:
      - codecairn_memory.ship_complete
      - codecairn_memory.measurement_valid
      - codecairn_memory.production_evidence_complete
