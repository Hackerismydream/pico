schema: pico.picobench.campaign.v1
suite: codecairn-task-effect-v2

provider:
  name: deepseek
  model: deepseek-v4-flash
  allow_fallback: false

execution:
  timeout_seconds: 180
  retry_policy: symmetric
  provider_call_max_attempts: 2
  max_comparison_block_attempts: 2
  max_retrieval_query_block_attempts: 1

budget:
  warning_cny: 25
  hard_cap_cny: 30
  max_provider_calls_per_trial: 9
  max_input_tokens_per_call: 16000
  max_output_tokens_per_call: 2048
  max_additional_provider_attempts: 36
  input_cache_miss_usd_per_million: 0.14
  output_usd_per_million: 0.28
  conservative_usd_to_cny_multiplier: 8
  external_service_reserve_cny: 0
  pricing_source: https://api-docs.deepseek.com/quick_start/pricing/
  provider_trial_budgets:
    codecairn-task-effect-calibration-v2:
      max_provider_calls_per_trial: 9
      max_input_tokens_per_call: 16000
      max_output_tokens_per_call: 2048
    codecairn-task-effect-v2:
      max_provider_calls_per_trial: 9
      max_input_tokens_per_call: 16000
      max_output_tokens_per_call: 2048

calibration:
  suite: codecairn-task-effect-v2-calibration
  repetitions: 1
  pack_ids:
    - codecairn-task-effect-calibration-v2
  expected_trials: 12
  expected_retrieval_cases: 10
  max_comparison_block_retries_total: 1
  expected_trials_by_pack:
    codecairn-task-effect-calibration-v2: 12
  expected_comparison_blocks_by_pack:
    codecairn-task-effect-calibration-v2: 6
  expected_retrieval_cases_by_pack:
