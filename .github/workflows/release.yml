# 发布构建——草稿。
#
# 规范发布验证器统一负责 TUI 构建、包构建、隔离安装、已安装运行时探针、wheel
# 清单检查和 sdist 往返验证。因此发布资产来自本地使用的同一 V-P0 门禁，而不是
# 第二套构建路径。
#
# 触发方式：推送版本标签（v1.2.3）或手动运行。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-distribution:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify distribution
        run: |
          uv run python scripts/verify_distribution.py \
            --output-root "$RUNNER_TEMP/pico-distribution" \
            --entrypoint pico \
            --extras base,channel-feishu,channel-qq,channel-wecom,channels,sandbox

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pico-distribution
          path: |
            ${{ runner.temp }}/pico-distribution/dist/*.whl
            ${{ runner.temp }}/pico-distribution/dist/*.tar.gz
            ${{ runner.temp }}/pico-distribution/distribution-report.json
          if-no-files-found: error

      # 推送版本标签时发布 GitHub Release 草稿，并附带已验证的 wheel、sdist 和
      # 证据报告。手动触发在上方 Actions 产物上传后停止。
      - name: Check tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${{ github.ref_name }}"
          v=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          base="${tag#v}"; base="${base%%-*}"
          [ "$base" = "$v" ] || { echo "tag $tag does not match pyproject version $v"; exit 1; }

      - name: Create draft GitHub Release with assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          ver="${tag#v}"
          today="$(date -u +%Y-%m-%d)"
          # 预发布标签绝不能成为 /releases/latest，因为 install.sh 会向公开安装器
          # 提供该版本。
          pre=""
          case "$tag" in *-*) pre="--prerelease" ;; esac
          sed "s/__VERSION__/$ver/g; s/__TAG__/$tag/g" \
            .github/release-notes-template.md > "$RUNNER_TEMP/notes.md"
          # 重跑时可重建陈旧草稿，但绝不能替换已发布版本。
          rel=$(gh api "repos/$repo/releases?per_page=100" --jq "map(select(.tag_name==\"$tag\"))[0] // {}")
          id=$(printf '%s' "$rel" | jq -r '.id // empty')
          isdraft=$(printf '%s' "$rel" | jq -r '.draft // false')
          if [ -n "$id" ] && [ "$isdraft" = "true" ]; then
            gh api -X DELETE "repos/$repo/releases/$id"
            id=""
          fi
          if [ -z "$id" ]; then
            distribution_root="$RUNNER_TEMP/pico-distribution"
            gh release create "$tag" \
              "$distribution_root"/dist/*.whl \
              "$distribution_root"/dist/*.tar.gz \
              "$distribution_root"/distribution-report.json \
              --title "Pico $ver ($today)" --notes-file "$RUNNER_TEMP/notes.md" --draft $pre
          else
            echo "Release $tag already published (id=$id); leaving as-is."
          fi

      # 可选：准备就绪后接入，在标签上发布到 PyPI：
      # - name: 发布到 PyPI
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: uv publish "$RUNNER_TEMP"/pico-distribution/dist/*
      #   env:
      #     UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
