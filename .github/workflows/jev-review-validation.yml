name: Jev review validation

on:
  push:
    branches: [chore/jev_review_validation]

permissions:
  contents: write

concurrency:
  group: jev-review-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          path: payload
      - uses: actions/checkout@v7
        with:
          ref: feat/jev_personalization_gate
          path: subject
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: subject/uv.lock
      - name: Frozen existing test environment
        working-directory: subject
        run: uv sync --frozen --extra dev --dev
      - name: Apply exact scoped patch and publish feature branch
        shell: bash
        run: |
          set -euo pipefail
          python payload/.jev-review/apply.py subject payload/.jev-review
          cd subject
          git add pico tests docs CONTEXT.md Makefile
          git diff --cached --name-only --diff-filter=ACMR | grep '\.py$' > /tmp/jev-changed-python.txt
          xargs -a /tmp/jev-changed-python.txt uv run --no-sync ruff check --select I --fix
          xargs -a /tmp/jev-changed-python.txt uv run --no-sync ruff format
          git add pico tests docs CONTEXT.md Makefile
          git diff --cached --check
          git config user.name 'Pico review automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: Add opt-in Jev preference triage and contract checks'
            git push origin HEAD:refs/heads/feat/jev_personalization_gate
          fi
      - name: Changed-file lint
        working-directory: subject
        run: |
          xargs -a /tmp/jev-changed-python.txt uv run --no-sync ruff check
          xargs -a /tmp/jev-changed-python.txt uv run --no-sync ruff format --check
      - name: Credential-free regression contracts
        if: success() || failure()
        working-directory: subject
        run: |
          uv run --no-sync pytest tests/test_personalizer_jev.py tests/test_personalizer_contract.py tests/test_routing_fallback_chain.py tests/test_config_routing.py tests/test_knn_router.py tests/test_call_efficiency.py tests/test_cli_runtime_assembly.py tests/test_agent_loop_memory_pipeline.py tests/test_context_invariants.py tests/test_agent_loop_empty_recovery.py -q
      - name: Archive exact committed source
        if: always()
        run: |
          cd subject
          git rev-parse HEAD > /tmp/pico-review-source-commit.txt
          git archive --format=zip HEAD -o /tmp/pico-review-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pico-review-source
          path: /tmp/pico-review-source*
          retention-days: 2
