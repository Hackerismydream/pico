name: Jev review validation

on:
  push:
    branches: [chore/jev_review_validation]

permissions:
  contents: read

concurrency:
  group: jev-review-validation
  cancel-in-progress: false

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, feature]
        python: [system, managed]
    name: '${{ matrix.revision }} / ${{ matrix.python }}'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: '${{ matrix.revision == ''baseline'' && ''697499a36c349bd0989344fd0dcd4282d23d33a9'' || ''bcd41b42fbbbeab7f28465839928379129ebb34c'' }}'
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Select interpreter
        run: |
          if [ '${{ matrix.python }}' = managed ]; then
            uv python install 3.12
            echo 'UV_PYTHON_PREFERENCE=only-managed' >> "$GITHUB_ENV"
          else
            echo 'UV_PYTHON=/usr/bin/python3' >> "$GITHUB_ENV"
          fi
      - name: Frozen existing dependencies
        run: uv sync --frozen --extra dev --dev
      - name: Run all diagnostic checks and retain exit codes
        env:
          PYTHONFAULTHANDLER: '1'
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os, subprocess, sys
          out = Path('/tmp/pico-review-results')
          out.mkdir()
          feature = '${{ matrix.revision }}' == 'feature'
          core = ['tests/test_routing_fallback_chain.py', 'tests/test_config_routing.py', 'tests/test_knn_router.py', 'tests/test_call_efficiency.py', 'tests/test_cli_runtime_assembly.py', 'tests/test_agent_loop_memory_pipeline.py', 'tests/test_context_invariants.py', 'tests/test_agent_loop_empty_recovery.py']
          new = ['tests/test_personalizer_jev.py', 'tests/test_personalizer_contract.py'] if feature else []
          commands = {
              'interpreter': ['uv','run','--no-sync','python','-VV'],
              'regression': ['uv','run','--no-sync','pytest', *new, *core, '-q', '--junitxml=' + str(out / 'regression.xml')],
              'lint': ['make','lint-python'],
              'focused': ['make','test-python'],
          }
          if feature:
              changed = subprocess.check_output(['git','diff','--name-only','697499a36c349bd0989344fd0dcd4282d23d33a9','HEAD','--','*.py'],text=True).splitlines()
              commands['changed_lint']=['uv','run','--no-sync','ruff','check', *changed]
              commands['changed_format']=['uv','run','--no-sync','ruff','format','--check', *changed]
              commands['assets']=['make','check-large-files','COMMIT_RANGE=--from-ref 697499a36c349bd0989344fd0dcd4282d23d33a9 --to-ref HEAD']
          results={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'python_kind':'${{ matrix.python }}', 'checks':{}}
          for name, command in commands.items():
              with (out / (name+'.txt')).open('w') as stream:
                  try:
                      run=subprocess.run(command,stdout=stream,stderr=subprocess.STDOUT,timeout=180)
                      code=run.returncode
                  except subprocess.TimeoutExpired:
                      code=124
              results['checks'][name]={'command':command,'exit_code':code}
              print(name,code,flush=True)
              print((out / (name+'.txt')).read_text()[-6000:],flush=True)
              (out/'results.json').write_text(json.dumps(results,indent=2))
          sys.exit(int(any(item['exit_code'] != 0 for item in results['checks'].values())))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'pico-review-${{ matrix.revision }}-${{ matrix.python }}'
          path: /tmp/pico-review-results/
          retention-days: 2
