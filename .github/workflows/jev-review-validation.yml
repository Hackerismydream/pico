name: Jev review validation
on:
  push:
    branches: [chore/jev_review_validation]
permissions:
  contents: read
jobs:
  validate-watcher-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: baead420b00fff47e5f073109a48868f986ac933
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
      - run: |
          uv python install 3.12
          echo 'UV_PYTHON_PREFERENCE=only-managed' >> "$GITHUB_ENV"
      - run: uv sync --frozen --extra dev --dev
      - name: Record environment
        run: |
          git rev-parse HEAD
          uv --version
          uv run --no-sync python -VV
          sha256sum uv.lock
          uname -a
      - name: Reproduce formerly crashing baseline modules
        env:
          PYTHONFAULTHANDLER: '1'
        run: |
          uv run --no-sync pytest \
            tests/test_routing_fallback_chain.py \
            tests/test_config_routing.py \
            tests/test_knn_router.py \
            tests/test_call_efficiency.py \
            tests/test_cli_runtime_assembly.py \
            tests/test_agent_loop_memory_pipeline.py \
            tests/test_context_invariants.py \
            tests/test_agent_loop_empty_recovery.py \
            tests/test_skill_watcher_lifecycle.py \
            -q
      - name: Run normal Python target
        env:
          PYTHONFAULTHANDLER: '1'
        run: make test-python
