name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make install-deps

      - name: Run pre-commit on changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          uv run pre-commit run --from-ref "$BASE" --to-ref HEAD

  python:
    name: python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: make install-deps

      - name: Focused Python lint
        run: make lint-python

      - name: Focused Python tests
        run: make test-python

  retained-python:
    name: retained Python suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-tui/package-lock.json

      - name: Install dependencies
        run: make install-deps

      - name: Build retained TUI fixture
        run: |
          npm ci
          npm run build
        working-directory: ui-tui

      - name: Instrument worker exit diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("benchmarks/picobench/packs/memory_skill/e2e.py")
          text = path.read_text(encoding="utf-8")
          old_call = "    await _communicate_and_reap(process)\n"
          new_call = (
              "    _stdout, _stderr = await _communicate_and_reap(process)\n"
              "    if _stderr:\n"
              "        sys.stderr.write(_stderr.decode('utf-8', errors='replace'))\n"
          )
          old_communicate = (
              "async def _communicate_and_reap(\n"
              "    process: asyncio.subprocess.Process,\n"
              ") -> None:\n"
              "    try:\n"
              "        await process.communicate()\n"
          )
          new_communicate = (
              "async def _communicate_and_reap(\n"
              "    process: asyncio.subprocess.Process,\n"
              ") -> tuple[bytes, bytes]:\n"
              "    try:\n"
              "        return await process.communicate()\n"
          )
          old_exit = (
              "    if process.returncode != 0:\n"
              "        result[\"status\"] = \"infrastructure_failure\"\n"
          )
          new_exit = (
              "    if process.returncode != 0:\n"
              "        result[\"status\"] = \"infrastructure_failure\"\n"
              "        result[\"error_type\"] = f\"worker_exit_{process.returncode}\"\n"
          )
          for old in (old_call, old_communicate, old_exit):
              if old not in text:
                  raise SystemExit(f"diagnostic patch target missing: {old!r}")
          text = text.replace(old_call, new_call, 1)
          text = text.replace(old_communicate, new_communicate, 1)
          text = text.replace(old_exit, new_exit, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Diagnose retained base environment
        run: |
          PYTHONFAULTHANDLER=1 uv run --frozen --extra dev --exact \
            pytest tests/integration/test_picobench_memory_skill_e2e.py -vv -s

  tui:
    name: TUI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui-tui/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ui-tui

      - name: Lint, type-check, and test
        run: |
          npm run lint
          npm run lint:rpc
          npm run lint:rpc-surface
          npm run type-check
          npm test
          npm run build
        working-directory: ui-tui
